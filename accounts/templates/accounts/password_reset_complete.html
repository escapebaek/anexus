{% extends 'base.html' %}
{% load static %}

{% block custom_css %}<link href="{% static 'css/pages/accounts.css' %}" rel="stylesheet" />{% endblock %}

{% block page_content %}
<div class="ac-page">
  <section class="ac-card">
    <header class="ac-card-head">
      <p class="ac-kicker">비밀번호 찾기</p>
      <h1 class="ac-title">비밀번호를 바꿨습니다</h1>
    </header>
    <div class="ac-card-body">
      <div class="ac-state is-ok"><i class="fas fa-check"></i></div>
      <p class="ac-text">새 비밀번호로 로그인해 주세요.</p>
      <div class="ac-actions"><a class="ac-btn ac-btn-primary" href="{% url 'login' %}">로그인</a></div>
    </div>
  </section>
</div>
{% endblock %}
