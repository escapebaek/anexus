{% extends 'base.html' %}
{% load static %}

{% block custom_css %}
<link href="{% static 'css/accounts/password_change.css' %}" rel="stylesheet" />
{% endblock %}

{% block page_content %}
<div class="pw-change-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-sm-8">
        <div class="pw-done-card">

          <div class="pw-done-header">
            <div class="pw-done-icon">
              <i class="fas fa-check"></i>
            </div>
            <h2 class="pw-done-title">변경 완료</h2>
            <p class="pw-done-subtitle">비밀번호가 성공적으로 변경되었습니다</p>
          </div>

          <div class="pw-done-body">
            <a href="{% url 'mypage' %}" class="pw-done-btn">
              마이페이지로 돌아가기 <i class="fas fa-arrow-right ms-2"></i>
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
