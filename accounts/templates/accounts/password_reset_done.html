{% extends 'base.html' %}
{% load static %}

{% block custom_css %}<link href="{% static 'css/pages/accounts.css' %}" rel="stylesheet" />{% endblock %}

{% block page_content %}
<div class="ac-page">
  <section class="ac-card">
    <header class="ac-card-head">
      <p class="ac-kicker">비밀번호 찾기</p>
      <h1 class="ac-title">메일을 확인해 주세요</h1>
    </header>
    <div class="ac-card-body">
      <div class="ac-state"><i class="fas fa-envelope-open-text"></i></div>
      <p class="ac-text">입력한 이메일로 가입된 계정이 있으면 비밀번호 재설정 링크를 보냈습니다. 몇 분 안에 도착합니다.</p>
      <p class="ac-text ac-muted">메일이 보이지 않으면 스팸함을 확인하거나, 가입할 때 쓴 이메일이 맞는지 확인해 주세요.</p>
      <div class="ac-actions"><a class="ac-btn ac-btn-primary" href="{% url 'login' %}">로그인으로</a></div>
    </div>
  </section>
</div>
{% endblock %}
